<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 3 - Image Gallery (Grid)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page-content">
    <h1>Task 3 — Image Gallery</h1>
    <p>Nine images in a CSS Grid, with a caption overlay on hover.</p>

    <!-- .gallery is the grid container -->
    <section class="gallery">

      <figure class="gallery__item">
        <img src="https://picsum.photos/seed/g1/400/400" alt="Gallery photo 1" />
        <figcaption>Mountains</figcaption>
      </figure>

      <figure class="gallery__item">
        <img src="https://picsum.photos/seed/g2/400/400" alt="Gallery photo 2" />
        <figcaption>City Lights</figcaption>
      </figure>

      <figure class="gallery__item">
        <img src="https://picsum.photos/seed/g3/400/400" alt="Gallery photo 3" />
        <figcaption>Ocean View</figcaption>
      </figure>

      <figure class="gallery__item">
        <img src="https://picsum.photos/seed/g4/400/400" alt="Gallery photo 4" />
        <figcaption>Forest Trail</figcaption>
      </figure>

      <figure class="gallery__item">
        <img src="https://picsum.photos/seed/g5/400/400" alt="Gallery photo 5" />
        <figcaption>Desert Road</figcaption>
      </figure>

      <figure class="gallery__item">
        <img src="https://picsum.photos/seed/g6/400/400" alt="Gallery photo 6" />
        <figcaption>Night Sky</figcaption>
      </figure>

      <figure class="gallery__item">
        <img src="https://picsum.photos/seed/g7/400/400" alt="Gallery photo 7" />
        <figcaption>Old Town</figcaption>
      </figure>

      <figure class="gallery__item">
        <img src="https://picsum.photos/seed/g8/400/400" alt="Gallery photo 8" />
        <figcaption>Autumn Leaves</figcaption>
      </figure>

      <figure class="gallery__item">
        <img src="https://picsum.photos/seed/g9/400/400" alt="Gallery photo 9" />
        <figcaption>Snowy Peak</figcaption>
      </figure>

    </section>
  </main>

</body>
</html>
