<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 2 - Grid Page Layout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- .layout is the grid container. Each child is placed via grid-area -->
  <div class="layout">
    <header class="area area--header">Header</header>
    <aside class="area area--sidebar">Sidebar</aside>
    <main class="area area--main">Main Content</main>
    <footer class="area area--footer">Footer</footer>
  </div>

</body>
</html>
