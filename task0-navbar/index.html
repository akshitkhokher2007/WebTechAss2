<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 0 - Navbar (Flexbox)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER = flex container. Logo on the left, nav links on the right -->
  <header class="navbar">
    <div class="navbar__logo">DevSpace</div>

    <nav>
      <ul class="navbar__links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-content">
    <h1>Task 0 — Navigation Bar</h1>
    <p>
      This header uses <code>display: flex</code> with
      <code>justify-content: space-between</code> to push the logo and the
      links apart, and <code>align-items: center</code> to line them up
      vertically.
    </p>
  </main>

</body>
</html>
